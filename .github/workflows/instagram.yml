name: Tweetlerden Instagram günlük yayın

on:
  schedule:
    - cron: "15 8 * * *" # 11:15 Türkiye; haber ve ilginç-bilgi tweet agent'larından sonra
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece üret, paylaşma"
        type: boolean
        default: false
      source_date:
        description: "Tweet taslağının tarihi (YYYY-MM-DD; boşsa bugün)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-daily-publication
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tweet taslaklarını al
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TWEET_SOURCE_REPOSITORY || 'barkin-bamu/sparkyapptr-x-publisher' }}
          path: tweet-source
          token: ${{ secrets.TWEET_SOURCE_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Reel video aracını kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Haberleri dönüştür, üret ve paylaş
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          HOSTING: github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          PUBLISH_LEDGER: github
        run: |
          DATE="${{ inputs.source_date || '' }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Istanbul date +%F)"; fi
          SOURCE="tweet-source/content/drafts/news-${DATE}.md"
          if [ ! -f "$SOURCE" ]; then SOURCE="tweet-source/content/drafts/${DATE}.md"; fi
          python tweet_to_instagram.py "$SOURCE" --date "$DATE" --content-kind news --out "content/${DATE}-news.json"
          python run_daily.py "content/${DATE}-news.json" --theme news --out-dir "out/${DATE}-news" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: İlginç bilgileri dönüştür, üret ve paylaş
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-terra' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'medium' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          HOSTING: github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_BRANCH: ${{ github.ref_name }}
          PUBLISH_LEDGER: github
        run: |
          DATE="${{ inputs.source_date || '' }}"
          if [ -z "$DATE" ]; then DATE="$(TZ=Europe/Istanbul date +%F)"; fi
          SOURCE="tweet-source/curiosities/${DATE}.md"
          python tweet_to_instagram.py "$SOURCE" --date "$DATE" --content-kind facts --out "content/${DATE}-facts.json"
          python run_daily.py "content/${DATE}-facts.json" --theme facts --out-dir "out/${DATE}-facts" ${{ inputs.dry_run && '--dry-run' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-media
          path: out/
